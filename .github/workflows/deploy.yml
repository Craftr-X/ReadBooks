name: Deploy VitePress to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 内容无变化也强制重新发布（如 Pages 后端吞掉上次部署时使用）
        type: boolean
        default: false

# 推送 gh-pages 分支需要 contents: write；查询 / 重触发 Pages 构建需要 pages: write。
# pages: write 不能降级为 read —— POST /repos/{repo}/pages/builds 是后端挂起后
# 唯一的程序化恢复手段，2026-11-10 的 #56 运行已实证有效（第 1 轮 errored，
# 等 60 秒重触发后第 2 轮 built）。#57 曾移除自动重试并降为 pages: read，
# 导致失败后必须人工点 workflow_dispatch，本次恢复。
permissions:
  contents: write
  pages: write

# 串行发布，避免两次构建互相覆盖 gh-pages 分支。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # 构建 ~4 分钟 + 最多 4 轮 Pages 构建（每轮最长 ~10 分钟）+ 退避，60 分钟兜底。
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # lastUpdated 依赖每个文件的 git 最后提交时间。浅克隆会把所有文件
          # 时间钉在 HEAD 上，任何提交（哪怕只改 workflow）都会导致全站
          # 1500+ HTML 变化，破坏增量发布。必须拉全量历史。
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run build
        env:
          # VitePress 渲染 1000+ 页面 + 构建本地搜索索引很吃内存，CI runner
          # 默认 Node 堆上限（~2GB）会 OOM。提高上限以匹配 runner 可用内存
          # （ubuntu-latest 16GB；2026-11 导入两本大书后 4GB 在渲染阶段不够用了）。
          NODE_OPTIONS: --max-old-space-size=8192

      # 增量发布。做法：把新 dist 覆盖到 gh-pages 顶端提交上，git 只把真正
      # 新增/变化的 blob 传给远端；内容无变化时跳过推送，不触发 Pages 部署。
      # 注意：Vite 入口 chunk（assets/app.*.js / chunks/theme.*.js）的哈希只要
      # 抖动，全站 1500+ HTML 都会跟着变，增量退化成全量并放大后端同步压力。
      # 因此这里把「本次变更文件数」写进 summary，便于第一时间发现退化。
      # --filter=blob:none --no-checkout 只拉提交和树对象，不下载旧文件内容；
      # read-tree 把旧树载入索引，git add -A 才能识别被删除的文件。
      # .nojekyll 必须保留：dist 里有下划线开头目录，跳过 Jekyll 处理。
      - name: Publish dist to gh-pages branch (incremental)
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
        run: |
          set -eu
          git clone -q --filter=blob:none --no-checkout --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" publish
          cd publish
          git read-tree HEAD
          rsync -a --delete --exclude .git --exclude .nojekyll ../dist/ ./
          touch .nojekyll
          git add -A
          if git diff --cached --quiet && [ "$FORCE" != "true" ]; then
            echo "内容无变化，跳过发布（未触发 Pages 部署）。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --cached --name-only | wc -l)
          echo "本次变更 ${changed} 个文件。"
          echo "changed_count=${changed}" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q --allow-empty -m "deploy: ${GITHUB_SHA} (forced)"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "deploy: ${GITHUB_SHA}"
          fi
          git push -q origin gh-pages
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 后端 syncing_files 挂起是 GitHub 服务端间歇性故障
      # （actions/deploy-pages#406；2026-11-10 20:42–21:26 同一 commit 连续 4 次
      # errored，21:27 后恢复）。仓库侧无法根治，但可以把人工干预降为 0：
      # 每轮失败后调用 Pages 重构建 API 重新触发同一份内容，带线性退避，
      # 最多 4 轮。#56 已实证该手段有效，不要再以「重试浪费时间」为由移除。
      - name: Wait for Pages build (auto retry)
        id: pages
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          set -u
          repo="${GITHUB_REPOSITORY}"
          max_attempts=4
          latest_status() {
            gh api "repos/${repo}/pages/builds/latest" --jq -r .status 2>/dev/null || echo unknown
          }
          latest_commit() {
            gh api "repos/${repo}/pages/builds/latest" --jq -r .commit 2>/dev/null || echo ""
          }
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "::group::Pages 构建 第 ${attempt}/${max_attempts} 轮"
            # 先等本次推送对应的构建登记上来，避免误读上一条构建的结果。
            registered=0
            for i in $(seq 1 24); do
              [ "$(latest_commit)" = "$PAGES_SHA" ] && { registered=1; break; }
              sleep 10
            done
            if [ "$registered" != "1" ]; then
              echo "::warning::240 秒内未登记与 ${PAGES_SHA:0:7} 对应的构建，继续按最新状态判断。"
            fi
            outcome=timeout
            for i in $(seq 1 40); do
              status="$(latest_status)"
              case "$status" in
                built)
                  echo "Pages 构建成功（第 ${attempt} 轮）。"
                  outcome=built
                  break
                  ;;
                errored)
                  echo "Pages 构建失败（后端同步挂起/超时）。"
                  outcome=errored
                  break
                  ;;
                *) sleep 15 ;;
              esac
            done
            echo "::endgroup::"
            if [ "$outcome" = "built" ]; then
              echo "attempts=${attempt}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              delay=$((attempt * 30))
              echo "第 ${attempt} 轮结果=${outcome}，调用 Pages 重构建 API 后等待 ${delay} 秒再试。"
              if ! gh api -X POST "repos/${repo}/pages/builds" >/dev/null; then
                echo "::warning::重构建 API 调用失败（检查 permissions.pages 是否为 write）；下一轮仍会按最新状态轮询。"
              fi
              sleep "$delay"
            fi
            attempt=$((attempt + 1))
          done
          echo "::error::连续 ${max_attempts} 轮未完成 Pages 构建。gh-pages 分支内容已是最新，这是 GitHub Pages 服务端故障（syncing_files 挂起）；后端恢复后重跑 workflow_dispatch 并勾选 force 即可，无需重新构建站点。"
          exit 1

      # 防「假成功」：Pages 报 built 不代表 CDN 上已是本次构建。
      # 用本次 dist 的入口 chunk 文件名做指纹，校验线上首页是否已引用它。
      # 只告警不判失败：CDN 传播延迟是常态，不该把它变成新的红色构建。
      - name: Verify live content
        if: steps.publish.outputs.changed == 'true'
        env:
          SITE_URL: https://craftr-x.github.io/ReadBooks/
        run: |
          set -u
          expected="$(find dist/assets -maxdepth 1 -name 'app.*.js' -printf '%f\n' | head -1)"
          if [ -z "$expected" ]; then
            echo "::warning::未找到入口 chunk，跳过线上校验。"
            exit 0
          fi
          echo "本次构建指纹：${expected}"
          ok=0
          for i in $(seq 1 20); do
            body="$(curl -fsSL --max-time 20 "${SITE_URL}?build=${GITHUB_RUN_ID}-${i}" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -Fq "$expected"; then
              echo "线上首页已引用本次构建，发布完成。"
              ok=1
              break
            fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::Pages 已报成功，但 5 分钟内线上首页仍未出现 ${expected}（CDN 缓存或后端同步延迟）。gh-pages 分支内容正确，稍后刷新即可；如持续异常可重跑 workflow_dispatch 并勾选 force。"
          fi

      - name: Deployment summary
        if: always() && steps.publish.outputs.changed == 'true'
        run: |
          {
            echo "### 部署摘要"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 变更文件数 | ${{ steps.publish.outputs.changed_count }} |"
            echo "| Pages 构建轮次 | ${{ steps.pages.outputs.attempts || '未完成' }} |"
            echo "| gh-pages commit | \`${{ steps.publish.outputs.sha }}\` |"
            echo "| 站点 | https://craftr-x.github.io/ReadBooks/ |"
            echo ""
            echo "变更文件数若长期接近全站页面数（1500+），说明构建产物哈希抖动、增量发布已退化，应优先排查构建确定性。"
          } >> "$GITHUB_STEP_SUMMARY"
