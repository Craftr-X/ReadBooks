name: Deploy VitePress to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 内容无变化也强制重新发布（如 Pages 后端吞掉上次部署时使用）
        type: boolean
        default: false

# 推送 gh-pages 分支需要 contents: write；查询 / 重触发 Pages 构建需要 pages: write。
# pages: write 不能降级为 read —— POST /repos/{repo}/pages/builds 是后端挂起后
# 唯一的程序化恢复手段，2026-11-10 的 #56 运行已实证有效（第 1 轮 errored，
# 等 60 秒重触发后第 2 轮 built）。#57 曾移除自动重试并降为 pages: read，
# 导致失败后必须人工点 workflow_dispatch，本次恢复。
permissions:
  contents: write
  pages: write

# 串行发布，避免两次构建互相覆盖 gh-pages 分支。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # 构建 ~4 分钟 + 最多 3 轮线上校验（每轮最长 12 分钟）+ 退避，60 分钟兜底。
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # lastUpdated 依赖每个文件的 git 最后提交时间。浅克隆会把所有文件
          # 时间钉在 HEAD 上，任何提交（哪怕只改 workflow）都会导致全站
          # 1500+ HTML 变化，破坏增量发布。必须拉全量历史。
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run build
        env:
          # VitePress 渲染 1000+ 页面 + 构建本地搜索索引很吃内存，CI runner
          # 默认 Node 堆上限（~2GB）会 OOM。提高上限以匹配 runner 可用内存
          # （ubuntu-latest 16GB；2026-11 导入两本大书后 4GB 在渲染阶段不够用了）。
          NODE_OPTIONS: --max-old-space-size=8192

      # 增量发布。做法：把新 dist 覆盖到 gh-pages 顶端提交上，git 只把真正
      # 新增/变化的 blob 传给远端；内容无变化时跳过推送，不触发 Pages 部署。
      # 注意：Vite 入口 chunk（assets/app.*.js / chunks/theme.*.js）的哈希只要
      # 抖动，全站 1500+ HTML 都会跟着变，增量退化成全量并放大后端同步压力。
      # 已由 docs/.vitepress/deterministic-search-index.mjs 在 transform 阶段
      # 规范化 MiniSearch 索引修好；这里仍把「本次变更文件数」写进 summary，
      # 作为增量是否退化的长期观测点（scripts/verify-build-determinism.mjs 可复核）。
      # --filter=blob:none --no-checkout 只拉提交和树对象，不下载旧文件内容；
      # read-tree 把旧树载入索引，git add -A 才能识别被删除的文件。
      # .nojekyll 必须保留：dist 里有下划线开头目录，跳过 Jekyll 处理。
      - name: Publish dist to gh-pages branch (incremental)
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
        run: |
          set -eu
          git clone -q --filter=blob:none --no-checkout --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" publish
          cd publish
          git read-tree HEAD
          rsync -a --delete --exclude .git --exclude .nojekyll ../dist/ ./
          touch .nojekyll
          git add -A
          if git diff --cached --quiet && [ "$FORCE" != "true" ]; then
            echo "内容无变化，跳过发布（未触发 Pages 部署）。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --cached --name-only | wc -l)
          echo "本次变更 ${changed} 个文件。"
          echo "changed_count=${changed}" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q --allow-empty -m "deploy: ${GITHUB_SHA} (forced)"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "deploy: ${GITHUB_SHA}"
          fi
          git push -q origin gh-pages
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 判定「发布是否真的生效」只认线上内容：CDN 首页是否引用本次 dist 的
      # app.*.js 指纹。2026-11-11 run 42964517356 实证：/pages/builds/latest
      # 因 `gh api --jq -r .status` 参数写错（--jq 只接受 1 个字符串参数），
      # 两个查询函数持续报 "accepts 1 arg(s), received 2"、被 2>/dev/null 静默
      # 吞掉并回落成 unknown / 空串，4 轮全判 timeout、被 60 分钟超时取消；
      # 但同期 4 次 Pages build 均 built（47~53 秒），远端 gh-pages 的 index.html
      # 与线上首页指纹完全一致，站点其实一直是健康的。
      # 因此 Pages API 降级为辅助信号（errored 时快速重触发），主判定改为线上指纹：
      # 既避开 API 权限差异，也天然防住「Pages 报 built 但 CDN 没刷新」的假成功。
      # 每轮最长 12 分钟（覆盖 CDN max-age=600），最多 3 轮 + 线性退避。
      - name: Verify live content (auto retry)
        id: pages
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: https://craftr-x.github.io/ReadBooks/
        run: |
          set -u
          repo="${GITHUB_REPOSITORY}"
          max_attempts=3
          poll_interval=15
          polls_per_attempt=48
          expected="$(find dist/assets -maxdepth 1 -name 'app.*.js' -printf '%f\n' | head -1)"
          if [ -z "$expected" ]; then
            echo "::error::未找到入口 chunk，无法校验线上内容。"
            exit 1
          fi
          echo "本次构建指纹：${expected}"

          # 不再静默吞掉 API 错误：一次性诊断输出，便于日后定位权限/端点问题。
          if ! gh api "repos/${repo}/pages/builds/latest" --jq '.status' >/dev/null 2>/tmp/pages-api.err; then
            echo "::warning::Pages builds API 读取失败（不影响判定，以线上指纹为准）：$(head -c 200 /tmp/pages-api.err)"
          fi

          live_matches() {
            body="$(curl -fsSL --max-time 20 "${SITE_URL}?build=${GITHUB_RUN_ID}-${attempt}-${i}" 2>/dev/null || true)"
            printf '%s' "$body" | grep -Fq "$expected"
          }
          latest_status() {
            gh api "repos/${repo}/pages/builds/latest" --jq '.status' 2>/dev/null || echo unknown
          }
          rebuild_pages() {
            if ! gh api -X POST "repos/${repo}/pages/builds" >/dev/null 2>/tmp/pages-rebuild.err; then
              echo "::warning::重构建 API 调用失败（检查 permissions.pages 是否为 write）：$(head -c 200 /tmp/pages-rebuild.err)"
            fi
          }

          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "::group::线上内容校验 第 ${attempt}/${max_attempts} 轮"
            outcome=timeout
            for i in $(seq 1 "$polls_per_attempt"); do
              if live_matches; then
                echo "线上首页已引用本次构建指纹，发布完成（第 ${attempt} 轮 / 第 ${i} 次探测）。"
                outcome=verified
                break
              fi
              # errored 是后端 syncing_files 挂起的明确信号，立刻重触发，不必空等 12 分钟。
              if [ "$(latest_status)" = "errored" ]; then
                echo "Pages 构建失败（后端同步挂起/超时），提前进入下一轮。"
                outcome=errored
                break
              fi
              sleep "$poll_interval"
            done
            echo "::endgroup::"
            if [ "$outcome" = "verified" ]; then
              echo "attempts=${attempt}" >> "$GITHUB_OUTPUT"
              echo "verified=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              delay=$((attempt * 30))
              echo "第 ${attempt} 轮结果=${outcome}，调用 Pages 重构建 API 后等待 ${delay} 秒再试。"
              rebuild_pages
              sleep "$delay"
            fi
            attempt=$((attempt + 1))
          done
          echo "attempts=${max_attempts}" >> "$GITHUB_OUTPUT"
          echo "verified=false" >> "$GITHUB_OUTPUT"
          echo "::error::连续 ${max_attempts} 轮线上首页仍未出现 ${expected}。gh-pages 分支内容已是最新，先手工核对站点；若确认是 Pages 后端故障，恢复后重跑 workflow_dispatch 并勾选 force，无需重新构建站点。"
          exit 1

      - name: Deployment summary
        if: always() && steps.publish.outputs.changed == 'true'
        run: |
          {
            echo "### 部署摘要"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 变更文件数 | ${{ steps.publish.outputs.changed_count }} |"
            echo "| 线上内容校验 | ${{ steps.pages.outputs.verified == 'true' && '通过' || '未通过' }} |"
            echo "| 校验轮次 | ${{ steps.pages.outputs.attempts || '未完成' }} |"
            echo "| gh-pages commit | \`${{ steps.publish.outputs.sha }}\` |"
            echo "| 站点 | https://craftr-x.github.io/ReadBooks/ |"
            echo ""
            echo "变更文件数若长期接近全站页面数（1500+），说明构建产物哈希抖动、增量发布已退化，应优先排查构建确定性。"
          } >> "$GITHUB_STEP_SUMMARY"
