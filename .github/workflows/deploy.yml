name: Deploy VitePress to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run build
        env:
          # VitePress 渲染 1000+ 页面 + 构建本地搜索索引很吃内存，CI runner
          # 默认 Node 堆上限（~2GB）会 OOM。提高上限以匹配 runner 可用内存
          # （ubuntu-latest 16GB；2026-11 导入两本大书后 4GB 在渲染阶段不够用了）。
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy3.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy1.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    # 3 次尝试 × 单次最长 10 分钟 + 退避，留足余量；异常挂起时也有兜底。
    timeout-minutes: 45
    steps:
      # Pages 后端偶发卡在 syncing_files（见 actions/deploy-pages#406），单次部署会超时。
      # 官方 Pages 限制明确「部署超过 10 分钟即超时」，属服务端硬限制，因此保持
      # deploy-pages 默认的 600000ms，不要调大客户端 timeout（只会空等 20 分钟）。
      # 改用最多 3 次串行重试承接短暂抖动；三次全失败时由最后一个 step 让 job 标红。
      - name: Deploy to GitHub Pages (1/3)
        id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # 等后端清理上一次被取消的 deployment，同时避开瞬时抖动。
      - name: Wait before retry (2/3)
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (2/3)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry (3/3)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (3/3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
