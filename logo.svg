<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#grad)"/>
  <!-- 打开的书本：以 x=64 为中轴左右镜像 -->
  <!-- 左页外轮廓（书脊在 64，页面顶点在 44, 俯角到 30） -->
  <path d="M64 44
           C54 36 42 35 30 38
           L30 82
           C42 79 54 80 64 88
           Z"
        fill="white" fill-opacity="0.16" stroke="white" stroke-width="4"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- 右页外轮廓（左页的水平镜像） -->
  <path d="M64 44
           C74 36 86 35 98 38
           L98 82
           C86 79 74 80 64 88
           Z"
        fill="white" fill-opacity="0.16" stroke="white" stroke-width="4"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- 左页文字线（居中于左页 x≈30~64，中线约 47） -->
  <path d="M38 52h18M38 62h18M38 72h12"
        stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <!-- 右页文字线（左页镜像，中线约 81） -->
  <path d="M72 52h18M72 62h18M78 72h12"
        stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
</svg>
